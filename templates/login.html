{% extends 'base.html' %}{% block body %}<div class="login-page"><div class="card login">
<img class="login-logo" src="{{ url_for('static', filename='header-logo.png') }}" alt="Carmona Hospital and Medical Center">
<form method="post">
<label for="u">Username</label><input id="u" name="username" required autofocus autocomplete="username" placeholder="Enter your username">
<label for="pw">Password</label><input id="pw" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
<button class="btn block">Sign in</button></form></div></div>{% endblock %}
